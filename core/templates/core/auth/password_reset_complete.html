{% extends 'core/base.html' %}
{% load static %}
{% block title %}Password Reset Complete – Munwan Car Rental{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{% url 'home' %}" class="logo logo-with-img auth-logo">
      <img src="{% static 'images/logo.png' %}" alt="Munwan Car Rental" width="44" height="44"/>
      <span class="logo-stack">
        <span class="logo-top">Munwan</span>
        <span class="logo-bot">Car Rental</span>
      </span>
    </a>
    <div style="font-size:2.6rem;text-align:center;margin-bottom:6px">✅</div>
    <h1 class="auth-title">Password updated</h1>
    <p class="auth-sub">
      Your password has been changed. You can now sign in with your
      new password.
    </p>
    <a href="{% url 'login' %}" class="auth-btn" style="display:block;text-align:center;text-decoration:none">Sign In</a>
  </div>
</div>
{% endblock %}
